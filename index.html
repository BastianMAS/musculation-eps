                // Trier l'historique : muscle > exercice > date (plus récent en premier)
                const sortedHistory = [...this.rmHistory].sort((a, b) => {
                    // 1. Tri par muscle
                    if (a.muscle !== b.muscle) {
                        return a.muscle.localeCompare(b.muscle);
                    }
                    // 2. Tri par exercice
                    if (a.exercise !== b.exercise) {
                        return a.exercise.localeCompare(b.exercise);
                    }

                    return new Date(b.date) - new Date(a.date);

            async exportSessionPDF(sessionIndex) {
                const session = this.sessions[sessionIndex];
                if (!session) return;
                
                // Vérifier que jsPDF est chargé
                if (typeof window.jspdf === 'undefined') {
                    alert('⚠️ Erreur : bibliothèque PDF non chargée');
                    return;
                }
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                const exercicesDetails = session.exercicesDetails || [];
                const date = new Date().toLocaleDateString('fr-FR');
                
                let y = 20; // Position verticale
                
                // ENTÊTE
                doc.setFontSize(22);
                doc.setTextColor(6, 182, 212); // Cyan
                doc.text('Livret Musculation', 105, y, { align: 'center' });
                
                y += 10;
                doc.setFontSize(18);
                doc.setTextColor(15, 23, 42); // Bleu foncé
                doc.text(session.nom, 105, y, { align: 'center' });
                
                // Ligne séparation
                y += 5;
                doc.setDrawColor(6, 182, 212);
                doc.setLineWidth(1);
                doc.line(20, y, 190, y);
                
                // INFOS GÉNÉRALES
                y += 10;
                doc.setFontSize(11);
                doc.setTextColor(100, 116, 139);
                doc.text(`Date: ${date}`, 20, y);
                doc.text(`Élève: ${this.currentUser}`, 105, y);
                
                y += 6;
                doc.text(`Objectif: ${session.type}`, 20, y);
                doc.text(`Exercices: ${exercicesDetails.length}`, 105, y);
                
                // EXERCICES
                y += 15;
                doc.setFontSize(14);
                doc.setTextColor(15, 23, 42);
                doc.text('Programme d\'entraînement', 20, y);
                
                y += 8;
                
                exercicesDetails.forEach((ex, index) => {
                    // Vérifier si on doit changer de page
                    if (y > 260) {
                        doc.addPage();
                        y = 20;
                    }
                    
                    // Titre exercice
                    doc.setFontSize(12);
                    doc.setTextColor(15, 23, 42);
                    doc.text(`${index + 1}. ${ex.nom}`, 25, y);
                    
                    y += 6;
                    
                    // Muscle
                    doc.setFontSize(10);
                    doc.setTextColor(6, 182, 212);
                    doc.text(`Muscle: ${ex.muscle}`, 30, y);
                    
                    y += 5;
                    
                    // Détails
                    doc.setFontSize(10);
                    doc.setTextColor(100, 116, 139);
                    doc.text(`Séries: ${ex.series}`, 30, y);
                    doc.text(`Reps: ${ex.reps}`, 80, y);
                    doc.text(`Charge: ${this.formatCharge(ex)}`, 130, y);
                    
                    y += 5;
                    doc.text(`Récup: ${ex.recup}s`, 30, y);
                    if (ex.forme) {
                        doc.text(`Forme: ${ex.forme}`, 80, y);
                    }
                    if (ex.tempo) {
                        doc.text(`Tempo: ${ex.tempo}`, 130, y);
                    }
                    
                    // Case à cocher
                    doc.setDrawColor(100, 116, 139);
                    doc.setLineWidth(0.5);
                    doc.rect(20, y - 4, 3, 3);
                    
                    y += 10;
                });
                
                // PIED DE PAGE
                const pageCount = doc.internal.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFontSize(8);
                    doc.setTextColor(100, 116, 139);
                    doc.text(`Généré le ${date} - Livret Musculation`, 105, 290, { align: 'center' });
                    doc.text(`Page ${i}/${pageCount}`, 190, 290, { align: 'right' });
                }
                
                // TÉLÉCHARGER
                const filename = `${session.nom.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/gi, '_')}_${date.replace(/\//g, '-')}.pdf`;
                doc.save(filename);
                
                console.log('✅ PDF généré:', filename);
            }


            async partagerSeance(sessionIndex) {
                const session = this.sessions[sessionIndex];
                if (!session) return;
                
                const exercicesDetails = session.exercicesDetails || [];
                
                // Créer texte à partager
                const texte = `📋 ${session.nom}
🎯 ${session.type}
💪 ${exercicesDetails.length} exercices

${exercicesDetails.map((ex, i) => 
                    `${i + 1}. ${ex.nom}
   💪 ${ex.muscle}
   ${ex.series} × ${ex.reps}${estTemps(ex.nom) ? ' s' : ''} • ${this.formatCharge(ex)} • ${ex.recup} s de repos${['Superset', 'Biset', 'Triset', 'Circuit'].includes(ex.forme) ? ' • ' + ex.forme : ''}`
                ).join('\n\n')}

📱 Musculation EPS`;
                
                // Vérifier si l'API Web Share est disponible
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: `Séance: ${session.nom}`,
                            text: texte
                        });
                        console.log('✅ Séance partagée');
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.log('Partage annulé ou non supporté, copie dans presse-papier');
                            this.copierDansPressePapier(texte);
                        }
                    }
                } else {
                    // Fallback: copier dans presse-papier
                    this.copierDansPressePapier(texte);
                }
            }

            copierDansPressePapier(texte) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(texte).then(() => {
                        alert('✅ Séance copiée dans le presse-papier !\n\nTu peux la coller où tu veux (WhatsApp, email, etc.)');
                    }).catch(() => {
                        this.afficherTexteACopier(texte);
                    });
                } else {
                    this.afficherTexteACopier(texte);
                }
            }

            afficherTexteACopier(texte) {
                const popup = document.createElement('div');
                popup.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: rgba(0, 0, 0, 0.9);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 10000;
                    padding: 1rem;
                `;
                
                popup.innerHTML = `
                    <div style="background: var(--bg-medium); border-radius: 1rem; padding: 2rem; max-width: 500px; width: 100%;">
                        <h3 class="text-white mb-3">📋 Copie ce texte</h3>
                        <textarea 
                            readonly 
                            style="width: 100%; height: 300px; padding: 1rem; border-radius: 0.5rem; font-family: monospace; font-size: 0.9rem;"
                            onclick="this.select()"
                        >${texte}</textarea>
                        <button onclick="this.parentElement.parentElement.remove()" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                            ✅ Fermer
                        </button>
                    </div>
                `;
                
                document.body.appendChild(popup);
                
                // Sélectionner le texte automatiquement
                setTimeout(() => {
                    popup.querySelector('textarea').select();
                }, 100);
            }

            calculateRM(e) {
                if (e) e.preventDefault();
                
                const muscle = document.getElementById('rm-muscle').value;
                const selectValue = document.getElementById('rm-exercise-select').value;
                const customValue = document.getElementById('rm-exercise-custom').value.trim();
                const exercise = selectValue === 'CUSTOM' ? customValue : selectValue;
                const weight = parseFloat(document.getElementById('rm-weight').value);
                const reps = parseInt(document.getElementById('rm-reps').value);
                const dateInput = document.getElementById('rm-date').value;
                
                if (!muscle || !exercise || !weight || !reps || !dateInput) {
                    alert('⚠️ Remplis tous les champs');
                    return;
                }
                
                let rm;
                if (reps === 1) {
                    rm = weight;
                } else if (reps <= 10) {
                    rm = weight * (1 + reps / 30);
                } else {
                    rm = weight * (1 + reps / 25);
                }
                
                rm = Math.round(rm * 10) / 10;
                
                const test = {
                    muscle,
                    exercise,
                    rm,
                    weight,
                    reps,
                    date: new Date(dateInput).toISOString()
                };
                
                this.rmHistory.push(test);
                this.saveRMHistory();
                
                // Réinitialiser le formulaire
                document.getElementById('rm-muscle').value = '';
                document.getElementById('rm-exercise-select').style.display = 'none';
                document.getElementById('rm-exercise-select').value = '';
                document.getElementById('rm-exercise-custom').style.display = 'none';
                document.getElementById('rm-exercise-custom').value = '';
                document.getElementById('rm-weight').value = '';
                document.getElementById('rm-reps').value = '';
                document.getElementById('rm-date').valueAsDate = new Date();
                
                this.render();
                
                console.log('✅ Test 1RM enregistré:', test);
            }

            updateRMExercicesList() {
                const muscle = document.getElementById('rm-muscle').value;
                const exerciceSelect = document.getElementById('rm-exercise-select');
                const exerciceCustom = document.getElementById('rm-exercise-custom');
                
                if (!muscle) {
                    exerciceSelect.style.display = 'none';
                    exerciceCustom.style.display = 'none';
                    return;
                }
                
                // Afficher le select et le remplir
                exerciceSelect.style.display = 'block';
                exerciceSelect.innerHTML = '<option value="">Choisir...</option>';
                
                const exercices = this.getExercicesByMuscle(muscle);
                exercices.forEach(ex => {
                    exerciceSelect.innerHTML += `<option value="${ex}">${ex}</option>`;
                });
                
                // Ajouter option "Autre"
                exerciceSelect.innerHTML += '<option value="CUSTOM">✏️ Autre exercice...</option>';
            }

            toggleRMCustomExercice() {
                const select = document.getElementById('rm-exercise-select');
                const customInput = document.getElementById('rm-exercise-custom');
                
                if (select.value === 'CUSTOM') {
                    customInput.style.display = 'block';
                    customInput.focus();
                    customInput.required = true;
                    select.required = false;
                } else {
                    customInput.style.display = 'none';
                    customInput.required = false;
                    select.required = true;
                }
            }

            editRM(index) {
                this.editingRM = index;
                this.render();
            }

            saveEditRM() {
                // Récupérer l'historique trié pour trouver le bon index original
                const sortedHistory = [...this.rmHistory].sort((a, b) => {
                    if (a.muscle !== b.muscle) return a.muscle.localeCompare(b.muscle);
                    if (a.exercise !== b.exercise) return a.exercise.localeCompare(b.exercise);
                    return new Date(b.date) - new Date(a.date);
                });
                
                const testToEdit = sortedHistory[this.editingRM];
                const originalIndex = this.rmHistory.indexOf(testToEdit);
                
                // Récupérer les nouvelles valeurs
                const muscle = document.getElementById('edit-rm-muscle').value;
                const exercise = document.getElementById('edit-rm-exercise').value.trim();
                const weight = parseFloat(document.getElementById('edit-rm-weight').value);
                const reps = parseInt(document.getElementById('edit-rm-reps').value);
                const date = document.getElementById('edit-rm-date').value;
                
                if (!muscle || !exercise || !weight || !reps || !date) {
                    alert('⚠️ Remplis tous les champs');
                    return;
                }
                
                // Recalculer le 1RM
                let rm;
                if (reps === 1) {
                    rm = weight;
                } else if (reps <= 10) {
                    rm = weight * (1 + reps / 30);
                } else {
                    rm = weight * (1 + reps / 25);
                }
                rm = Math.round(rm * 10) / 10;
                
                // Mettre à jour le test
                this.rmHistory[originalIndex] = {
                    muscle,
                    exercise,
                    weight,
                    reps,
                    rm,
                    date: new Date(date).toISOString()
                };
                
                this.saveRMHistory();
                this.editingRM = null;
                this.render();
                
                alert('✅ Test modifié avec succès !');
            }

            cancelEditRM() {
                this.editingRM = null;
                this.render();
            }

            deleteRM(index) {
                if (confirm('Supprimer ce test ?')) {
                    // Récupérer l'historique trié pour trouver le bon index original
                    const sortedHistory = [...this.rmHistory].sort((a, b) => {
                        if (a.muscle !== b.muscle) return a.muscle.localeCompare(b.muscle);
                        if (a.exercise !== b.exercise) return a.exercise.localeCompare(b.exercise);
                        return new Date(b.date) - new Date(a.date);
                    });
                    
                    const testToDelete = sortedHistory[index];
                    const originalIndex = this.rmHistory.indexOf(testToDelete);
                    
                    this.rmHistory.splice(originalIndex, 1);
                    this.saveRMHistory();
                    this.render();
                }
            }

            calculateCharges() {
                const select = document.getElementById('charges-rm-select');
                const index = parseInt(select.value);
                if (isNaN(index)) {
                    this.calculatedCharges = {};
                } else {
                    const test = this.rmHistory[index];
                    this.calculatedCharges = {
                        exercise: test.exercise, 
                        rm: test.rm,
                        selectedIndex: index
                    };
                    this.saveCalculatedCharges();
                }
                this.render();
            }

            updatePercentage(value) {
                this.selectedPercentage = parseInt(value);
                const percentageDisplay = document.querySelector('.text-cyan[style*="font-size: 2.5rem"]');
                const chargeDisplay = percentageDisplay ? percentageDisplay.nextElementSibling : null;
                
                if (percentageDisplay && chargeDisplay && this.calculatedCharges.rm) {
                    percentageDisplay.textContent = `${this.selectedPercentage}%`;
                    chargeDisplay.textContent = `${Math.round(this.calculatedCharges.rm * this.selectedPercentage / 100)} kg`;
                    
                    const rows = document.querySelectorAll('.charges-table tbody tr');
                    const ranges = [
                        [85, 100], [30, 60], [65, 80], [60, 75], [40, 60], [10, 120]
                    ];
                    
                    rows.forEach((row, index) => {
                        const [min, max] = ranges[index];
                        if (this.selectedPercentage >= min && this.selectedPercentage <= max) {
                            row.style.background = row.children[0].style.color.replace('rgb', 'rgba').replace(')', ', 0.2)');
                        } else {
                            row.style.background = 'transparent';
                        }
                    });
                }
            }

            unlockAudio() {
                // Débloquer l'audio au premier clic utilisateur (requis sur iOS)
                if (!this.audioUnlocked) {
                    try {
                        if (!this.audioContext) {
                            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        }
                        // Jouer un son silencieux pour débloquer
                        const oscillator = this.audioContext.createOscillator();
                        const gainNode = this.audioContext.createGain();
                        gainNode.gain.value = 0.001; // Quasi silencieux
                        oscillator.connect(gainNode);
                        gainNode.connect(this.audioContext.destination);
                        oscillator.start(this.audioContext.currentTime);
                        oscillator.stop(this.audioContext.currentTime + 0.01);
                        this.audioUnlocked = true;
                        console.log('✅ Audio débloqué');
                    } catch (e) {
                        console.log('❌ Impossible de débloquer l\'audio:', e);
                    }
                }
            }

            playTimerSound() {
                // Création d'un bip sonore avec Web Audio API
                try {
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    
                    // Reprendre le contexte si suspendu (iOS)
                    if (this.audioContext.state === 'suspended') {
                        this.audioContext.resume();
                    }
                    
                    // PREMIER BIP (800Hz)
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    
                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';
                    
                    // Volume plus fort : 0.7 au lieu de 0.3
                    gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.7, this.audioContext.currentTime + 0.01);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                    
                    oscillator.start(this.audioContext.currentTime);
                    oscillator.stop(this.audioContext.currentTime + 0.3);
                    
                    // DEUXIÈME BIP (1000Hz)
                    setTimeout(() => {
                        const osc2 = this.audioContext.createOscillator();
                        const gain2 = this.audioContext.createGain();
                        osc2.connect(gain2);
                        gain2.connect(this.audioContext.destination);
                        osc2.frequency.value = 1000;
                        osc2.type = 'sine';
                        gain2.gain.setValueAtTime(0, this.audioContext.currentTime);
                        gain2.gain.linearRampToValueAtTime(0.7, this.audioContext.currentTime + 0.01);
                        gain2.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                        osc2.start(this.audioContext.currentTime);
                        osc2.stop(this.audioContext.currentTime + 0.3);
                    }, 200);
                    
                    // TROISIÈME BIP (1200Hz) - NOUVEAU
                    setTimeout(() => {
                        const osc3 = this.audioContext.createOscillator();
                        const gain3 = this.audioContext.createGain();
                        osc3.connect(gain3);
                        gain3.connect(this.audioContext.destination);
                        osc3.frequency.value = 1200;
                        osc3.type = 'sine';
                        gain3.gain.setValueAtTime(0, this.audioContext.currentTime);
                        gain3.gain.linearRampToValueAtTime(0.7, this.audioContext.currentTime + 0.01);
                        gain3.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                        osc3.start(this.audioContext.currentTime);
                        osc3.stop(this.audioContext.currentTime + 0.3);
                    }, 400);
                } catch (e) {
                    console.log('❌ Son non supporté:', e);
                }
            }

            flashScreen() {
                // Créer un overlay flash
                const flash = document.createElement('div');
                flash.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: #06b6d4;
                    opacity: 0;
                    z-index: 99999;
                    pointer-events: none;
                    transition: opacity 0.1s;
                `;
                document.body.appendChild(flash);
                
                // Animation du flash
                setTimeout(() => flash.style.opacity = '0.8', 10);
                setTimeout(() => flash.style.opacity = '0', 150);
                setTimeout(() => flash.style.opacity = '0.6', 300);
                setTimeout(() => flash.style.opacity = '0', 450);
                setTimeout(() => flash.style.opacity = '0.4', 600);
                setTimeout(() => {
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 200);
                }, 750);
            }


        }

        let app;
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => { app = new LivretApp(); });
        } else {
            app = new LivretApp();
        }

        // Service Worker (hors ligne)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW :', err));
            });
        }

</script>
